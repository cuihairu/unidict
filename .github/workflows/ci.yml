name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  std-only:
    name: Std-only (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      # 统一三平台工具链为 MSVC（Windows runner 默认 PATH 里 MinGW g++ 在前，
      # 会与 vcpkg 的 MSVC ABI 库和 Qt MSVC 库产生链接灾难）
      - name: Setup MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      # Windows runner 无预装 zlib 开发包，走 vcpkg（动态库）
      - name: Install zlib (Windows)
        if: runner.os == 'Windows'
        run: vcpkg install zlib --triplet x64-windows

      # ctest 运行时需要能找到 vcpkg 动态库（zlib1.dll）
      - name: Add vcpkg bin to PATH (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: echo "$VCPKG_INSTALLATION_ROOT/installed/x64-windows/bin" >> "$GITHUB_PATH"

      # 注意：必须用 shell 引用 $VCPKG_INSTALLATION_ROOT —— workflow 里的
      # ${{ env.* }} context 读不到 runner 系统环境变量，会展开为空
      - name: Configure (std-only)
        shell: bash
        run: |
          EXTRA_ARGS=""
          if [ "$RUNNER_OS" = "Windows" ]; then
            EXTRA_ARGS="-DCMAKE_TOOLCHAIN_FILE=$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake -DVCPKG_TARGET_TRIPLET=x64-windows"
          fi
          cmake -G Ninja -B build-std -S . \
            -DCMAKE_BUILD_TYPE=Release \
            -DUNIDICT_BUILD_QT_CORE=OFF \
            -DUNIDICT_BUILD_ADAPTER_QT=OFF \
            -DUNIDICT_BUILD_QT_APPS=OFF \
            -DUNIDICT_BUILD_QT_TESTS=OFF \
            -DUNIDICT_BUILD_STD_CLI=ON \
            $EXTRA_ARGS

      - name: Build
        run: cmake --build build-std -j

      - name: Test
        run: ctest --test-dir build-std --output-on-failure

  qt:
    name: Qt (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      # 锁死 MSVC：runner 预装 MinGW g++ 在 PATH 前面，CMake/Ninja 默认会选中它，
      # 而 aqt 的 Qt 官方二进制只有 MSVC ABI —— 混用必然 undefined reference
      - name: Setup MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      # Windows runner 无预装 zlib 开发包，走 vcpkg（动态库）
      - name: Install zlib (Windows)
        if: runner.os == 'Windows'
        run: vcpkg install zlib --triplet x64-windows

      # ctest 运行时需要能找到 vcpkg 动态库（zlib1.dll）
      - name: Add vcpkg bin to PATH (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: echo "$VCPKG_INSTALLATION_ROOT/installed/x64-windows/bin" >> "$GITHUB_PATH"

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          # 6.8+：老版本 Qt（6.6.x）的 QtGui 依赖 AGL framework，新 Xcode SDK 已移除
          version: "6.8.3"
          cache: true
          cache-key-prefix: install-qt-683-tts
          # Qml/Quick/QuickControls2 随 Qt6 base 包安装（非 addon）；
          # modules 只列 addon：TextToSpeech 在 qtspeech，
          # 且 qtspeech 的 CMake config 会 find_dependency(Qt6Multimedia)，
          # 漏装 qtmultimedia 会让 find_package(TextToSpeech) 自判失败
          modules: "qtspeech qtmultimedia"

      # 注意：必须用 shell 引用 $VCPKG_INSTALLATION_ROOT —— workflow 里的
      # ${{ env.* }} context 读不到 runner 系统环境变量，会展开为空
      - name: Configure (Qt)
        shell: bash
        run: |
          EXTRA_ARGS=""
          if [ "$RUNNER_OS" = "Windows" ]; then
            EXTRA_ARGS="-DCMAKE_TOOLCHAIN_FILE=$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake -DVCPKG_TARGET_TRIPLET=x64-windows"
          fi
          cmake -G Ninja -B build-qt -S . \
            -DCMAKE_BUILD_TYPE=Release \
            -DUNIDICT_BUILD_QT_CORE=ON \
            -DUNIDICT_BUILD_ADAPTER_QT=ON \
            -DUNIDICT_BUILD_QT_APPS=ON \
            -DUNIDICT_BUILD_QT_TESTS=ON \
            -DUNIDICT_BUILD_STD_CLI=ON \
            $EXTRA_ARGS

      - name: Build
        run: cmake --build build-qt -j

      # Windows 可运行版交付：windeployqt 收集 Qt DLL（含 platforms/qwindows.dll）
      # + vcpkg 的 zlib DLL，打 zip 上传 artifact（仅 CI 产物分发，不做 Release/tag）
      - name: Package GUI (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -e
          mkdir -p dist
          cp build-qt/Release/unidict_gui.exe dist/
          "$QT_ROOT_DIR/bin/windeployqt.exe" --release --no-translations dist/unidict_gui.exe
          cp "$VCPKG_INSTALLATION_ROOT"/installed/x64-windows/bin/*.dll dist/
          cp README.md LICENSE dist/ 2>/dev/null || true
          cd dist
          zip -r ../unidict-gui-windows.zip .
          cd ..

      - name: Upload GUI artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: unidict-gui-windows
          path: unidict-gui-windows.zip
          retention-days: 14

      - name: Test
        run: ctest --test-dir build-qt --output-on-failure
