name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  std-only:
    name: Std-only (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      # 统一三平台工具链为 MSVC（Windows runner 默认 PATH 里 MinGW g++ 在前，
      # 会与 vcpkg 的 MSVC ABI 库和 Qt MSVC 库产生链接灾难）
      - name: Setup MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      # Windows runner 无预装 zlib 开发包，走 vcpkg（动态库）
      - name: Install zlib (Windows)
        if: runner.os == 'Windows'
        run: vcpkg install zlib --triplet x64-windows

      # ctest 运行时需要能找到 vcpkg 动态库（zlib1.dll）
      - name: Add vcpkg bin to PATH (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: echo "$VCPKG_INSTALLATION_ROOT/installed/x64-windows/bin" >> "$GITHUB_PATH"

      # 注意：必须用 shell 引用 $VCPKG_INSTALLATION_ROOT —— workflow 里的
      # ${{ env.* }} context 读不到 runner 系统环境变量，会展开为空
      - name: Configure (std-only)
        shell: bash
        run: |
          EXTRA_ARGS=""
          if [ "$RUNNER_OS" = "Windows" ]; then
            EXTRA_ARGS="-DCMAKE_TOOLCHAIN_FILE=$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake -DVCPKG_TARGET_TRIPLET=x64-windows"
          fi
          cmake -G Ninja -B build-std -S . \
            -DCMAKE_BUILD_TYPE=Release \
            -DUNIDICT_BUILD_QT_CORE=OFF \
            -DUNIDICT_BUILD_ADAPTER_QT=OFF \
            -DUNIDICT_BUILD_QT_APPS=OFF \
            -DUNIDICT_BUILD_QT_TESTS=OFF \
            -DUNIDICT_BUILD_STD_CLI=ON \
            $EXTRA_ARGS

      - name: Build
        run: cmake --build build-std -j

      - name: Test
        run: ctest --test-dir build-std --output-on-failure

  qt:
    name: Qt (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      # 锁死 MSVC：runner 预装 MinGW g++ 在 PATH 前面，CMake/Ninja 默认会选中它，
      # 而 aqt 的 Qt 官方二进制只有 MSVC ABI —— 混用必然 undefined reference
      - name: Setup MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      # Windows runner 无预装 zlib 开发包，走 vcpkg（动态库）
      - name: Install zlib (Windows)
        if: runner.os == 'Windows'
        run: vcpkg install zlib --triplet x64-windows

      # ctest 运行时需要能找到 vcpkg 动态库（zlib1.dll）
      - name: Add vcpkg bin to PATH (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: echo "$VCPKG_INSTALLATION_ROOT/installed/x64-windows/bin" >> "$GITHUB_PATH"

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          # 6.10.3：Xcode 26 的 macOS SDK 移除了 AGL.framework，
          # Qt <=6.8.3 的 QtGui 链接行仍带 -framework AGL（QTBUG-137687，
          # 修复在 6.8.4/6.9.2+），链接 unidict_gui 直接
          # "ld: framework 'AGL' not found"；6.10 出厂已无此依赖
          version: "6.10.3"
          cache: true
          cache-key-prefix: install-qt-6103-tts
          # Qml/Quick/QuickControls2 随 Qt6 base 包安装（非 addon）；
          # modules 只列 addon：TextToSpeech 在 qtspeech，
          # 且 qtspeech 的 CMake config 会 find_dependency(Qt6Multimedia)，
          # 漏装 qtmultimedia 会让 find_package(TextToSpeech) 自判失败
          modules: "qtspeech qtmultimedia"

      # 注意：必须用 shell 引用 $VCPKG_INSTALLATION_ROOT —— workflow 里的
      # ${{ env.* }} context 读不到 runner 系统环境变量，会展开为空
      - name: Configure (Qt)
        shell: bash
        run: |
          EXTRA_ARGS=""
          if [ "$RUNNER_OS" = "Windows" ]; then
            EXTRA_ARGS="-DCMAKE_TOOLCHAIN_FILE=$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake -DVCPKG_TARGET_TRIPLET=x64-windows"
          fi
          cmake -G Ninja -B build-qt -S . \
            -DCMAKE_BUILD_TYPE=Release \
            -DUNIDICT_BUILD_QT_CORE=ON \
            -DUNIDICT_BUILD_ADAPTER_QT=ON \
            -DUNIDICT_BUILD_QT_APPS=ON \
            -DUNIDICT_BUILD_QT_TESTS=ON \
            -DUNIDICT_BUILD_STD_CLI=ON \
            $EXTRA_ARGS

      - name: Build
        run: cmake --build build-qt -j

      # Windows 可运行版交付：windeployqt 收集 Qt DLL（含 platforms/qwindows.dll）
      # + vcpkg 的 zlib DLL，打 zip 上传 artifact（仅 CI 产物分发，不做 Release/tag）
      - name: Package GUI (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -e
          mkdir -p dist
          cp build-qt/Release/unidict_gui.exe dist/
          "$QT_ROOT_DIR/bin/windeployqt.exe" --release --no-translations dist/unidict_gui.exe
          cp "$VCPKG_INSTALLATION_ROOT"/installed/x64-windows/bin/*.dll dist/
          cp README.md LICENSE dist/ 2>/dev/null || true
          echo "build $(date -u +%Y-%m-%dT%H:%MZ) commit ${GITHUB_SHA::8}" > dist/BUILD-INFO.txt
          # Windows 的 Git Bash 没有 zip 命令（上次 exit 127 的根因），
          # 用系统自带 PowerShell 的 Compress-Archive 打包
          powershell -NoProfile -Command "Compress-Archive -Path dist/* -DestinationPath unidict-gui-windows.zip -Force"

      - name: Upload GUI artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: unidict-gui-windows
          path: unidict-gui-windows.zip
          retention-days: 14

      # 诊断：ctest 对该测试只显示 Failed 无输出。已确认 -functions 正常
      # （二进制健康、QApplication 可构造）、退出码 0x1、跑测试本体零输出
      # —— 逐 slot 单跑并把 QTest 日志写到文件（绕开 stdout 缓冲丢失），
      # 钉死挂点在哪个函数、断言输出是什么
      - name: Debug test_lookup_adapter exit code (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = (Get-ChildItem -Recurse -Filter test_lookup_adapter.exe build-qt | Select-Object -First 1).FullName
          # 先跑不涉及 QTextToSpeech 的 slot，再跑涉及 TTS 构造的 slot——
          # 若 slot2 绿 slot1 挂，即可锁定 TTS 构造路径
          "=== slot A (reload, no TTS): reload_replaces_dictionaries_from_env"
          & $exe reload_replaces_dictionaries_from_env -o "$env:TEMP\slotA.txt,txt" 2>&1 | Out-String | Write-Host
          "SLOTA_EXIT=0x{0:X}" -f $LASTEXITCODE
          if (Test-Path "$env:TEMP\slotA.txt") { Get-Content "$env:TEMP\slotA.txt" | Write-Host }
          "=== slot B (TTS): mdict_password_env_roundtrip"
          & $exe mdict_password_env_roundtrip -o "$env:TEMP\slotB.txt,txt" 2>&1 | Out-String | Write-Host
          "SLOTB_EXIT=0x{0:X}" -f $LASTEXITCODE
          if (Test-Path "$env:TEMP\slotB.txt") { Get-Content "$env:TEMP\slotB.txt" | Write-Host }
          "=== full run with file log + plugin debug"
          $env:QT_DEBUG_PLUGINS = "1"
          & $exe -o "$env:TEMP\full.txt,txt" 2>&1 | Out-String | Write-Host
          "FULL_EXIT=0x{0:X}" -f $LASTEXITCODE
          if (Test-Path "$env:TEMP\full.txt") { Get-Content "$env:TEMP\full.txt" | Write-Host }
          "=== ctest LastTest.log (ctest-captured output)"
          $last = Get-ChildItem -Recurse -Filter LastTest.log build-qt | Select-Object -First 1
          if ($last) { Get-Content $last.FullName -Tail 60 | Write-Host }

      # 诊断：同款 ctest 吞输出问题——qt_adapters_bridge（历史从未在
      # Windows 绿过，q7_ai_service 的 shebang 脚本 CreateProcess 拉不起）
      # 与 cli_main（状态隔离走 UNIDICT_STATE_DIR，验被子进程吃到的落点），
      # 直跑 exe 把 QTest 日志落文件再回读
      - name: Debug adapters/cli_main output (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($name in @('test_qt_adapters_bridge', 'test_cli_main')) {
            $exe = (Get-ChildItem -Recurse -Filter "$name.exe" build-qt | Select-Object -First 1).FullName
            if (-not $exe) { "no exe for $name"; continue }
            "=== $name direct run"
            $tmp = "$env:TEMP\$name.txt"
            & $exe -o "$tmp,txt" 2>&1 | Out-String | Write-Host
            "$name EXIT=0x{0:X}" -f $LASTEXITCODE
            if (Test-Path $tmp) { Get-Content $tmp | Write-Host }
          }

      - name: Test
        run: ctest --test-dir build-qt --output-on-failure

  # 一键安装脚本语法闸门：本机无 pwsh，用 Windows runner 的 PowerShell
  # Parser 做运行时语法校验（install.sh 走 bash -n）；脚本改动即时发现坏语法
  install-scripts:
    name: Install scripts syntax
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate install.ps1 syntax
        shell: pwsh
        run: |
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'install.ps1').Path, [ref]$null, [ref]$errors)
          if ($errors.Count -gt 0) { $errors; exit 1 }
          Write-Host 'install.ps1 parses OK'

      - name: Validate install.sh syntax
        shell: bash
        run: bash -n install.sh && echo 'install.sh parses OK'

  # 覆盖率（std 面 gcov 插桩 + gcovr 出 XML）：公共仓库 Codecov tokenless
  # 上传、不配 secret；阈值与状态策略由仓库根 codecov.yml 驱动（对齐 atlas 口径）
  coverage:
    name: Coverage (std, gcov -> Codecov)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Install gcovr
        run: pip install --quiet gcovr

      - name: Configure (coverage)
        run: |
          cmake -G Ninja -B build-cov -S . \
            -DCMAKE_BUILD_TYPE=Debug \
            -DUNIDICT_ENABLE_COVERAGE=ON \
            -DUNIDICT_BUILD_QT_CORE=OFF \
            -DUNIDICT_BUILD_ADAPTER_QT=OFF \
            -DUNIDICT_BUILD_QT_APPS=OFF \
            -DUNIDICT_BUILD_QT_TESTS=OFF \
            -DUNIDICT_BUILD_STD_CLI=ON

      - name: Build
        run: cmake --build build-cov -j

      - name: Test
        run: ctest --test-dir build-cov -j4 --output-on-failure

      # gcov 卫生：生成前清陈旧 gcov 中间件，避免复用出假口径
      # （memory: gcov-manual-measurement-hygiene）
      - name: Generate coverage XML (gcovr)
        run: |
          find build-cov -name '*.gcov*' -delete 2>/dev/null || true
          gcovr --root . --filter 'core/' --exclude 'tests/' \
            --xml-pretty --output coverage.xml build-cov

      - name: Upload to Codecov (tokenless, public repo)
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          flags: std
          fail_ci_if_error: false
