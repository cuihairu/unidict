name: deploy-docs

# 文档站（VitePress）构建：docs/site/** 变更或手动触发。
# 只构建并上传 docs-site artifact，不直接部署 Pages——
# 统一由 daily-build.yml 的 deploy-site 任务下载合并后单出口部署，避免两个 workflow 互踩 Pages 源。
on:
  push:
    branches: [main]
    paths:
      - 'docs/site/**'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-build
  cancel-in-progress: true

jobs:
  build:
    name: Build VitePress site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs/site/package-lock.json

      - name: Install deps
        working-directory: docs/site
        run: npm ci

      - name: Build site
        working-directory: docs/site
        run: npm run build

      - name: Upload docs-site artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: docs/site/.vitepress/dist
          retention-days: 90
          if-no-files-found: error
