# 同步中转 Worker 部署(server_plan §6/§7 B1):推送 sync-worker/ 变更到 Cloudflare Workers
# 所需 secrets:CLOUDFLARE_API_TOKEN(Workers Edit 权限)、CLOUDFLARE_ACCOUNT_ID
name: Deploy Sync Worker

on:
  push:
    branches: [main]
    paths:
      - "sync-worker/**"
      - ".github/workflows/deploy-sync-worker.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        working-directory: sync-worker
        run: npm ci

      - name: Deploy to Cloudflare Workers
        working-directory: sync-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
