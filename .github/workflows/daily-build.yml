name: Daily Build

# 每日构建流水线：产物发布到滚动 nightly Release（固定 tag `nightly`，
# 每次清旧传新只留最新，对齐 falcon nightly 形态）——用户取件走 Release 页。
# 不打版本 tag、不做正式发版。artifact 侧同样全仓库只留一份"最新每日构建"：
# 固定名 daily-build，上传前先删历史同名（v4 产物不可变，同名直接传会报错）。

on:
  schedule:
    # UTC 21:17 = 北京时间 05:17；挑非整点分避开 runner 高峰拥堵
    - cron: '17 21 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write # collect job 删除历史 daily-build artifact 需要

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
          - os: macos-latest
            name: macos-arm64
          - os: ubuntu-latest
            name: linux-x64
          # linux-arm64：公共免费 arm runner（一键安装脚本覆盖 aarch64 Linux）
          - os: ubuntu-24.04-arm
            name: linux-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Linux 直接 apt 装 ninja：gha-setup-ninja 拉的预编译二进制在 aarch64 runner
      # 上 exec 不动（版本探测空输出报 incorrect version），apt 包双架构通吃
      - name: Setup Ninja (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y ninja-build
          ninja --version

      - name: Setup Ninja (Windows/macOS)
        if: runner.os != 'Linux'
        uses: seanmiddleditch/gha-setup-ninja@v5

      # 锁死 MSVC：runner 默认 PATH 里 MinGW g++ 在前，与 Qt 官方 MSVC
      # 二进制混用必然 undefined reference（CI 踩过的坑）
      - name: Setup MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install zlib (Windows)
        if: runner.os == 'Windows'
        run: vcpkg install zlib --triplet x64-windows

      - name: Install Qt
        if: runner.os != 'Linux'
        uses: jurplel/install-qt-action@v4
        with:
          # 6.10.3：Xcode 26 SDK 移除 AGL.framework，Qt <=6.8.3 链接
          # unidict_gui 报 "ld: framework 'AGL' not found"（QTBUG-137687）
          version: "6.10.3"
          cache: true
          cache-key-prefix: install-qt-6103-tts
          # modules 只列 addon：qtspeech（TTS）的 CMake config 会
          # find_dependency(Qt6Multimedia)，漏装 qtmultimedia 会让
          # find_package(TextToSpeech) 自判失败
          modules: "qtspeech qtmultimedia"

      # Linux 只打无依赖 CLI（std-only）：Qt 桌面应用在 Linux 没有
      # 依赖打包就分发不出去（glibc/Qt 版本地狱），桌面用户按 README
      # 自行构建；产物结构见下方 Package 各平台段
      - name: Configure
        shell: bash
        run: |
          EXTRA_ARGS=""
          if [ "$RUNNER_OS" = "Windows" ]; then
            EXTRA_ARGS="-DCMAKE_TOOLCHAIN_FILE=$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake -DVCPKG_TARGET_TRIPLET=x64-windows"
          fi
          if [ "$RUNNER_OS" = "Linux" ]; then
            cmake -G Ninja -B build -S . \
              -DCMAKE_BUILD_TYPE=Release \
              -DUNIDICT_BUILD_QT_CORE=OFF \
              -DUNIDICT_BUILD_ADAPTER_QT=OFF \
              -DUNIDICT_BUILD_QT_APPS=OFF \
              -DUNIDICT_BUILD_QT_TESTS=OFF \
              -DUNIDICT_BUILD_STD_CLI=ON \
              $EXTRA_ARGS
          else
            cmake -G Ninja -B build -S . \
              -DCMAKE_BUILD_TYPE=Release \
              -DUNIDICT_BUILD_QT_CORE=ON \
              -DUNIDICT_BUILD_ADAPTER_QT=ON \
              -DUNIDICT_BUILD_QT_APPS=ON \
              -DUNIDICT_BUILD_QT_QMLUI=ON \
              -DUNIDICT_BUILD_QT_TESTS=OFF \
              -DUNIDICT_BUILD_STD_CLI=ON \
              $EXTRA_ARGS
          fi

      - name: Build
        run: cmake --build build -j

      # BuildOptions 把运行时产物统一放 ${CMAKE_BINARY_DIR}/Release
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -e
          mkdir -p stage
          # GUI 主程序 = unidict_qml.exe（QML 应用，与 docs/ui 原型同源；
          # BUGS.md BUG-002）。Qt6 WIN32 子系统：双击不弹控制台（BUG-001）
          cp build/Release/unidict_qml.exe stage/
          # windeployqt 必须跑：缺 platforms/qwindows.dll 会报
          # "failed to load platform plugin"；--qmldir 扫 QML import 收
          # Quick/Material/Dialogs 插件；cli.exe 复用同目录 Qt DLL
          "$QT_ROOT_DIR/bin/windeployqt.exe" --release --no-translations --qmldir qmlui stage/unidict_qml.exe
          cp build/Release/unidict_cli.exe build/Release/unidict_cli_std.exe stage/
          # 自带同步中转（B5，server_plan §7）：单二进制零依赖，
          # 随包分发供自建中转形态开箱即用
          cp build/Release/unidict-relay.exe stage/
          cp "$VCPKG_INSTALLATION_ROOT"/installed/x64-windows/bin/*.dll stage/
          cp examples/dict.json stage/
          # 内置真实词典（BUGS.md BUG-004）：CC-CEDICT 汉英 12.5 万简体
          # 词头（CC BY-SA 4.0，署名见 dictionaries/CC-CEDICT-ATTRIBUTION.md）
          cp dictionaries/ccedict-zh-en.json stage/
          cp dictionaries/CC-CEDICT-ATTRIBUTION.md stage/
          # 随包开源词典（scripts/fetch_sample_dicts.sh 拉取 5 件，资产
          # 不入 git 仓——打包时现拉）：ECDICT 英汉 ~340 万词（MIT）、
          # WikDict 汉英/英汉（CC BY-SA 4.0）、FreeDict 英德/英中（GPL-3.0）。
          # GUI 开箱自动挂载其中的小件（合计 <5MB）；ECDICT/eng-deu 大件
          # 在 dictionaries/ 子目录按需加载（UNIDICT_DICTS/--scan-dir/词典管理）
          scripts/fetch_sample_dicts.sh
          mkdir -p stage/dictionaries
          cp -R dictionaries/downloaded/. stage/dictionaries/
          find stage/dictionaries -name '.done' -delete
          cat > stage/PLATFORM-NOTES.txt <<'NOTES'
          Unidict 每日构建 - Windows x64
          包含: unidict_qml.exe（GUI 主程序）、unidict_cli.exe（Qt CLI）、
                unidict_cli_std.exe（无 Qt 依赖 CLI）、
                unidict-relay.exe（自带同步中转，可选自建）、
                ccedict-zh-en.json（内置 CC-CEDICT 汉英词典，12.5 万简体
                词头，CC BY-SA 4.0）、dict.json（英文演示样本）、
                dictionaries/（5 个开源词典：ECDICT 英汉 ~340 万词 MIT、
                WikDict 汉英/英汉 CC BY-SA 4.0、FreeDict 英德/英中 GPL-3.0；
                小件开箱自动加载，ECDICT/eng-deu 大件按需挂载；
                署名与许可见 dictionaries/ATTRIBUTION.md）

          最简验证（命令行，能输出释义即构建可用）:
            set UNIDICT_DICTS=dict.json
            unidict_cli_std.exe hello
          预期输出: hello: A greeting or expression of goodwill.

          GUI 验证: 双击 unidict_qml.exe——开箱即自动加载同目录的
          ccedict-zh-en.json 与 dict.json 及 dictionaries/ 内的
          WikDict×2/FreeDict eng-zho 小件（无需设置环境变量），
          输入「你好」或 hello 应出词条。
          大件按需挂载示例:
            set UNIDICT_DICTS=%CD%\dictionaries\ecdict-stardict\stardict-ecdict-2.4.2.ifo
            unidict_cli_std.exe lobster
          词典检索走 UNIDICT_DICTS 环境变量，可指向任意 .ifo/.mdx 等词典。

          说明: 若 SmartScreen 拦截，点"更多信息 -> 仍要运行"
          （每日构建未做代码签名）。
          NOTES
          powershell -NoProfile -Command "Compress-Archive -Path stage/* -DestinationPath unidict-windows-x64.zip -Force"

      # 安装器（Inno Setup，runner 预装 6.x；缺失则 choco 兜底）：
      # Program Files + 开始菜单/桌面快捷方式 + 卸载入口（BUGS.md 任务面）
      - name: Build installer (Inno Setup)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "/DSourceRoot=$PWD\stage" "/DOutputDir=$PWD" "packaging\windows\unidict.iss"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-Item .\unidict-windows-x64-setup.exe | Select-Object Name,Length

      # 真装走查：静默安装 → 文件/开始菜单/卸载入口齐 → GUI 子系统=2
      # （零控制台口径，BUG-001）→ 装后目录冒烟出释义
      - name: Verify installer (silent install + start menu + GUI subsystem)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Start-Process -Wait -FilePath ".\unidict-windows-x64-setup.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART"
          $app = "$env:ProgramFiles\Unidict"
          foreach ($f in @("$app\unidict_qml.exe", "$app\unidict_cli_std.exe", "$app\unidict-relay.exe", "$app\dict.json", "$app\ccedict-zh-en.json", "$app\CC-CEDICT-ATTRIBUTION.md", "$app\dictionaries\ATTRIBUTION.md", "$app\dictionaries\ecdict-stardict\stardict-ecdict-2.4.2.ifo", "$app\dictionaries\wikdict-zh-en\stardict.ifo", "$app\unins000.exe")) {
            if (-not (Test-Path $f)) { Write-Host "MISSING: $f"; exit 1 }
          }
          $lnk = "$env:ProgramData\Microsoft\Windows\Start Menu\Programs\Unidict\Unidict.lnk"
          if (-not (Test-Path $lnk)) { Write-Host "MISSING start-menu shortcut: $lnk"; exit 1 }
          $pe = [IO.File]::ReadAllBytes("$app\unidict_qml.exe")
          $off = [BitConverter]::ToInt32($pe, 0x3C)
          # PE 头布局：e_lfanew + 4(签名) + 20(COFF) + 68(OptionalHeader 内 Subsystem 偏移) = +92
          $sub = [BitConverter]::ToUInt16($pe, $off + 92)
          Write-Host "unidict_qml.exe PE subsystem = $sub (2 = GUI, no console)"
          if ($sub -ne 2) { Write-Host "FAIL: expected subsystem 2 (GUI)"; exit 1 }
          $env:UNIDICT_DICTS = "$app\dict.json"
          $out = & "$app\unidict_cli_std.exe" hello
          if ($LASTEXITCODE -ne 0 -or -not ($out -match 'greeting')) { Write-Host "SMOKE FAIL: $out"; exit 1 }
          # 内置真实词典冒烟（BUG-004）：CC-CEDICT 汉英查「计算机」
          $env:UNIDICT_DICTS = "$app\ccedict-zh-en.json"
          $out2 = & "$app\unidict_cli_std.exe" 计算机
          if ($LASTEXITCODE -ne 0 -or -not ($out2 -match 'computer')) { Write-Host "CEDICT SMOKE FAIL: $out2"; exit 1 }
          # 随包大件冒烟：ECDICT 英汉 340 万词查 lobster
          $env:UNIDICT_DICTS = "$app\dictionaries\ecdict-stardict\stardict-ecdict-2.4.2.ifo"
          $out3 = & "$app\unidict_cli_std.exe" lobster
          if ($LASTEXITCODE -ne 0 -or -not ($out3 -match 'lobster')) { Write-Host "ECDICT SMOKE FAIL: $out3"; exit 1 }
          Write-Host "installer verify OK: files + start-menu + uninstaller + GUI subsystem + smoke (sample + cedict + ecdict)"

      - name: Verify bundle identity + icon keys (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -e
          # BUG-007 回归闸门：CFBundle* 键为空的 .app 照样能打包、能双击，
          # 只有 Launch Services 归一/签名公证才会炸——不校验就会「修完又空」。
          # 键名对照 CMake 模板 Modules/MacOSXBundleInfo.plist.in：
          #   CFBundleIdentifier       ← MACOSX_BUNDLE_GUI_IDENTIFIER（旧名，非 CPack 那个）
          #   CFBundleName             ← MACOSX_BUNDLE_BUNDLE_NAME
          #   CFBundleIconFile         ← MACOSX_BUNDLE_ICON_FILE
          #   CFBundleShortVersionString← MACOSX_BUNDLE_SHORT_VERSION_STRING
          plist=build/Release/unidict_qml.app/Contents/Info.plist
          for key in CFBundleIdentifier CFBundleName CFBundleIconFile \
                     CFBundleShortVersionString CFBundleVersion CFBundleExecutable; do
            val=$(/usr/libexec/PlistBuddy -c "Print :$key" "$plist" 2>/dev/null || echo "")
            if [ -z "$val" ]; then echo "FAIL: $key 为空（$plist）"; exit 1; fi
            echo "  $key = $val"
          done
          icns="build/Release/unidict_qml.app/Contents/Resources/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconFile' "$plist")"
          if [ ! -f "$icns" ]; then echo "FAIL: 缺 icns: $icns"; exit 1; fi
          head -c 4 "$icns" | grep -q icns || { echo "FAIL: icns magic 不对"; exit 1; }
          echo "bundle verify OK: 身份键非空 + icns $(stat -f%z "$icns") bytes"

      - name: Package (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -e
          mkdir -p stage
          # GUI 主程序 = unidict_qml.app（QML 应用，与 docs/ui 原型同源；
          # BUGS.md BUG-002）。macdeployqt 把 Qt frameworks/插件收进
          # bundle（自包含），-qmldir 扫 QML import 收 Quick 系插件
          "$QT_ROOT_DIR/bin/macdeployqt" build/Release/unidict_qml.app -qmldir=qmlui
          cp -R build/Release/unidict_qml.app stage/
          # 随包词典进 bundle Resources：app 内未设 UNIDICT_DICTS 时自动
          # 加载（main.cpp 兜底）——内置 CC-CEDICT 汉英（BUG-004）+ 演示
          # 样本 + 开源小件词典，双击即有词典可查
          mkdir -p stage/unidict_qml.app/Contents/Resources
          cp examples/dict.json dictionaries/ccedict-zh-en.json \
             dictionaries/CC-CEDICT-ATTRIBUTION.md \
             stage/unidict_qml.app/Contents/Resources/
          # 随包开源词典（scripts/fetch_sample_dicts.sh 拉取 5 件）进
          # Resources/dictionaries/：小件（WikDict×2/FreeDict eng-zho）
          # 开箱自动挂载，ECDICT/eng-deu 大件按需加载
          scripts/fetch_sample_dicts.sh
          mkdir -p stage/unidict_qml.app/Contents/Resources/dictionaries
          cp -R dictionaries/downloaded/. \
             stage/unidict_qml.app/Contents/Resources/dictionaries/
          find stage/unidict_qml.app/Contents/Resources/dictionaries -name '.done' -delete
          cp build/Release/unidict_cli build/Release/unidict_cli_std stage/
          # 自带同步中转（B5，server_plan §7）：单二进制零依赖，
          # 随包分发供自建中转形态开箱即用
          cp build/Release/unidict-relay stage/
          cp examples/dict.json dictionaries/ccedict-zh-en.json \
             dictionaries/CC-CEDICT-ATTRIBUTION.md stage/
          cat > stage/PLATFORM-NOTES.txt <<'NOTES'
          Unidict 每日构建 - macOS (Apple Silicon)
          包含: unidict_qml.app（GUI 主程序）、unidict_cli、
                unidict_cli_std（无 Qt 依赖）、
                unidict-relay（自带同步中转，可选自建）、
                ccedict-zh-en.json（内置 CC-CEDICT 汉英词典，12.5 万简体
                词头，CC BY-SA 4.0）、dict.json（英文演示样本）、
                bundle Resources/dictionaries/（5 个开源词典：ECDICT 英汉
                ~340 万词 MIT、WikDict 汉英/英汉 CC BY-SA 4.0、FreeDict
                英德/英中 GPL-3.0；小件自动加载，大件按需挂载；
                署名与许可见 Resources/dictionaries/ATTRIBUTION.md）

          最简验证（命令行，能输出释义即构建可用）:
            export UNIDICT_DICTS=dict.json
            ./unidict_cli_std hello
          预期输出: hello: A greeting or expression of goodwill.

          GUI 验证: 先清除下载隔离属性再打开:
            xattr -cr unidict_qml.app
            open unidict_qml.app
          bundle 内已带 ccedict-zh-en.json、dict.json 与 dictionaries/
          小件（自动加载），搜索「你好」或 hello 应出词条。
          大件按需挂载示例:
            export UNIDICT_DICTS="$PWD/unidict_qml.app/Contents/Resources/dictionaries/ecdict-stardict/stardict-ecdict-2.4.2.ifo"
            ./unidict_cli_std lobster

          说明: 未签名，Gatekeeper 会拦直接打开的 app，务必先 xattr。
          NOTES
          # 必须先进 stage：zip . 在 workspace 根会把整个 build/ 打进包
          cd stage
          zip -qr ../unidict-macos-arm64.zip .

      - name: Package (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -e
          mkdir -p stage
          cp build/Release/unidict_cli_std stage/
          # 自带同步中转（B5，server_plan §7）：单二进制零依赖，
          # 随包分发供自建中转形态开箱即用
          cp build/Release/unidict-relay stage/
          cp examples/dict.json stage/
          # 内置真实词典（BUGS.md BUG-004）：CC-CEDICT 汉英 12.5 万简体
          # 词头（CC BY-SA 4.0，署名见 CC-CEDICT-ATTRIBUTION.md）
          cp dictionaries/ccedict-zh-en.json stage/
          cp dictionaries/CC-CEDICT-ATTRIBUTION.md stage/
          cat > stage/PLATFORM-NOTES.txt <<'NOTES'
          Unidict 每日构建 - ${{ matrix.name }}（仅 CLI，无 Qt 依赖）
          包含: unidict_cli_std（std-only CLI）、
                unidict-relay（自带同步中转，可选自建）、
                ccedict-zh-en.json（CC-CEDICT 汉英词典，12.5 万简体
                词头，CC BY-SA 4.0）、dict.json（英文演示样本）

          最简验证（能输出释义即构建可用）:
            chmod +x unidict_cli_std
            UNIDICT_DICTS=dict.json ./unidict_cli_std hello
          预期输出: hello: A greeting or expression of goodwill.

          内置汉英词典验证（12.5 万词条，装载约 2 秒属正常）:
            UNIDICT_DICTS=ccedict-zh-en.json ./unidict_cli_std 你好
          预期输出: 释义含 "ni3 hao3"（你好 的拼音）。

          说明: Linux 桌面（GUI）版需按 README 自行构建——Qt 应用
          没有依赖打包在别的机器跑不起来，故每日构建不打包 GUI。
          NOTES
          # 必须先进 stage：zip . 在 workspace 根会把整个 build/ 打进包
          cd stage
          zip -qr ../unidict-${{ matrix.name }}.zip .
          cd ..

      # 系统包（deb/rpm）：std CLI 零 Qt 依赖，元数据/依赖见
      # cmake/packaging_linux.cmake；固定文件名直链进 nightly Release
      - name: Package (Linux deb/rpm)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -e
          command -v rpmbuild >/dev/null 2>&1 || sudo apt-get install -y rpm
          # CPACK_OUTPUT_FILE_PREFIX 固定 build/dist，-B 改不动它——从那里取包
          cpack --config build/CPackConfig.cmake -G "DEB;RPM"
          mv build/dist/unidict_*.deb "unidict-${{ matrix.name }}.deb"
          mv build/dist/unidict-*.rpm "unidict-${{ matrix.name }}.rpm"
          ls -la unidict-*.deb unidict-*.rpm

      - name: Upload platform package
        uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.name }}
          path: |
            unidict-*.zip
            unidict-*.exe
            unidict-*.deb
            unidict-*.rpm
          retention-days: 3

  # Android 壳（M1 起，mobile_plan 方案 B）：Gradle + AGP 内建 Kotlin，
  # externalNativeBuild 经 adapters/android/CMakeLists.txt 出 JNI .so 进包。
  # debug 签名直装（release 签名/R8 是 M5 的活）。
  build-android:
    name: Build (android-arm64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      # M5 起 daily 直接出 release 包（R8 混淆 + 资源收缩 + debug 证书代签，
      # 可直装；正式上架签名等密钥，见 todo.md M5 余项）
      - name: Assemble release APK
        run: |
          cd android
          ./gradlew --no-daemon assembleRelease

      - name: Package (Android)
        run: |
          set -e
          mkdir -p stage
          cp android/app/build/outputs/apk/release/app-release.apk stage/unidict-android.apk
          cat > stage/PLATFORM-NOTES.txt <<'NOTES'
          Unidict 每日构建 - Android（arm64-v8a + x86_64 双 ABI）
          包含: unidict-android.apk（M5 release 包：R8 混淆 + 资源收缩；
          查词五模式 + 词典管理 SAF 导入 + 生词本标签/笔记/CSV
          导出 + TTS 朗读 + 首启引导 + 深色主题跟随系统；
          首启内置 CC-CEDICT 汉英词典 12.5 万词条（CC BY-SA 4.0，
          开箱即可查真实词条）+ json/dsl/csv 三格式示例词典）

          安装验证:
            1. 安装 apk（未知来源应用按机型提示放行；release 为 debug
               证书代签，与 debug 包可互相覆盖安装）
            2. 打开 "Unidict"，首次启动出欢迎引导，点"知道了"进入
               （首次装载 12.5 万词条需一两秒，属正常）
            3. 状态行出现 "M2-SMOKE-OK"（dicts=4 indexed=121412 …）
               与 "M4-TTS-READY" 即构建可用
            4. 查词页搜「你好」应出 CC-CEDICT 词条（拼音+英译）；
               搜 hello 应见聚合 2 条（Unidict Sample + Test DSL）；
               "词典"页可启停/删除词典、可经 SAF 导入 .mdx/.json 等文件；
               卡片右上角 ▶ 可朗读；生词本支持标签筛选/笔记/CSV 导出
            5. 系统深色模式下界面跟随变暗（Android 10+ 生效）

          说明: release 包用 debug 证书代签（可直装）；正式上架签名/
          应用商店合规待密钥（M5 余项，见 todo.md）。
          NOTES
          cd stage
          zip -qr ../unidict-android.zip .

      - name: Upload android package
        uses: actions/upload-artifact@v4
        with:
          name: pkg-android
          path: unidict-android.zip
          retention-days: 3

  # 汇总：三平台 zip + Android apk + BUILD_INFO + VERIFY 打成一个固定名 artifact。
  # 上传前先删历史同名 daily-build——v4 产物不可变，不删必报错；
  # 删了再传即"全仓库只存在一份最新每日构建"
  collect:
    name: Collect daily-build
    needs: [build, build-android]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download platform packages
        uses: actions/download-artifact@v4
        with:
          pattern: pkg-*
          merge-multiple: true
          path: pkgs

      - name: Remove previous daily-build artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ids=$(gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.name == "daily-build") | .id')
          if [ -n "$ids" ]; then
            echo "$ids" | while read -r id; do
              gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/$id" \
                && echo "deleted artifact $id"
            done
          else
            echo "no previous daily-build artifact"
          fi

      - name: Build info and verify guide
        run: |
          set -e
          VERSION=$(sed -n 's/^project(Unidict VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt | head -1)
          UTC_TIME=$(date -u +'%Y-%m-%d %H:%M UTC')
          BJ_TIME=$(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M 北京时间')
          BUILD_DATE=$(date -u +'%Y%m%d')
          {
            echo "Unidict 每日构建 (daily-build)"
            echo "更新时间: ${UTC_TIME} / ${BJ_TIME}"
            echo "Commit:   ${GITHUB_SHA}"
            echo "短 sha:   ${GITHUB_SHA::8}"
            echo "版本:     ${VERSION}（CMake project VERSION，非 Release 版本号）"
            echo "触发方式: ${{ github.event_name }}"
            echo ""
            echo "分发: 滚动 nightly Release（固定 tag nightly，清旧传新）"
            echo "      + GitHub Pages 下载页（备用镜像）。"
            echo ""
            echo "平台产物:"
            echo "  unidict-windows-x64.zip        Windows 10/11 x64: GUI + CLI + CLI(std) + relay"
            echo "  unidict-windows-x64-setup.exe  Windows 安装器: Program Files + 开始菜单 + 卸载入口"
            echo "  unidict-macos-arm64.zip        macOS Apple Silicon: GUI.app + CLI + relay"
            echo "  unidict-linux-x64.zip          Linux x64: CLI(std，无 Qt 依赖) + relay"
            echo "  unidict-linux-x64.deb/.rpm     Linux x64 系统包（CLI + relay）"
            echo "  unidict-linux-arm64.zip        Linux arm64: CLI(std，无 Qt 依赖) + relay"
            echo "  unidict-linux-arm64.deb/.rpm   Linux arm64 系统包（CLI + relay）"
            echo "  unidict-android.zip            Android（arm64+x86_64）: release apk"
          } > BUILD_INFO.txt
          cat > VERIFY.md <<'VERIFY'
          # 最简验证
          每个平台 zip 内附 dict.json 示例词典与 PLATFORM-NOTES.txt。

          ## Windows
          1. 解压 unidict-windows-x64.zip
          2. 双击 unidict_qml.exe（SmartScreen 拦截时"仍要运行"）——
             同目录 dict.json 自动加载，搜 hello 出词条即 OK
          3. 命令行验证:
             `set UNIDICT_DICTS=dict.json && unidict_cli_std.exe hello`
          或用安装器: 双击 unidict-windows-x64-setup.exe（装 Program Files，
          开始菜单/桌面快捷方式 + 卸载入口；开始菜单启动全程无控制台窗口）

          ## macOS (Apple Silicon)
          1. 解压 unidict-macos-arm64.zip
          2. `xattr -cr unidict_qml.app && open unidict_qml.app`
             （未签名，必须先清隔离属性；bundle 内已带 dict.json 自动加载）
          3. 命令行验证:
             `UNIDICT_DICTS=dict.json ./unidict_cli_std hello`

          ## Linux x64
          1. 解压 unidict-linux-x64.zip
          2. `chmod +x unidict_cli_std && UNIDICT_DICTS=dict.json ./unidict_cli_std hello`
          3. 输出 "hello: A greeting or expression of goodwill." 即 OK
          或装系统包（CLI + relay，与 zip 同内容）:
          - deb 系: `sudo apt install ./unidict-linux-x64.deb`
          - rpm 系: `sudo dnf install ./unidict-linux-x64.rpm`

          ## 自带同步中转（可选，桌面平台随包附带）
          unidict-relay 是单二进制自建中转（PROTOCOL.md v1，密文过境：
          中转只见密文，密钥不出端）。设备同步默认关闭；自建中转形态
          才需要它，用法:
            ./unidict-relay --host 127.0.0.1 --port 8788 --data ./relay-state
          启动后对 `GET /api/sync/relay/ping` 探活
          （返回 service=unidict-sync-relay、protocol=1）。

          ## Android
          1. 解压 unidict-android.zip，安装 unidict-android.apk
             （未知来源应用按机型提示放行）
          2. 打开 "Unidict"，首次出欢迎引导（点"知道了"），自动冒烟后
             状态行 "M2-SMOKE-OK" 与 "M4-TTS-READY" 即 OK；
             查词页搜 hello 聚合 2 条，词典页启停/删除/SAF 导入可用，
             卡片 ▶ 朗读，系统深色模式跟随变暗
          VERIFY
          # 打总包：各平台 zip 平铺 + 顶层说明（artifact 解开即见）
          mv pkgs/unidict-windows-x64.zip pkgs/unidict-macos-arm64.zip \
             pkgs/unidict-linux-x64.zip pkgs/unidict-linux-arm64.zip \
             pkgs/unidict-android.zip .
          # 固定文件名：Release/下载页直链恒可达（版本信息在包内 BUILD_INFO）
          zip -q "unidict-daily.zip" \
            unidict-windows-x64.zip unidict-macos-arm64.zip \
            unidict-linux-x64.zip unidict-linux-arm64.zip \
            unidict-android.zip BUILD_INFO.txt VERIFY.md
          # 供后续步骤引用的输出
          echo "daily_zip=unidict-daily.zip" >> "$GITHUB_ENV"
          echo "utc_time=${UTC_TIME}" >> "$GITHUB_ENV"
          echo "bj_time=${BJ_TIME}" >> "$GITHUB_ENV"

      - name: Upload daily-build
        uses: actions/upload-artifact@v4
        with:
          name: daily-build
          path: ${{ env.daily_zip }}
          retention-days: 14
          if-no-files-found: error

      - name: Run summary
        run: |
          {
            echo "## 每日构建产物"
            echo ""
            echo "| 项 | 值 |"
            echo "|---|---|"
            echo "| 更新时间 | ${utc_time} / ${bj_time} |"
            echo "| Commit | \`${GITHUB_SHA}\` |"
            echo "| 产物 | artifact **daily-build**（唯一最新版，历史已清理） |"
            echo "| 平台 | windows-x64（GUI+CLI+安装器）/ macos-arm64（GUI+CLI）/ linux-x64/arm64（CLI+deb/rpm）/ android（查词 apk） |"
            echo ""
            echo "下载: 本 run 页面底部 Artifacts 区 \`daily-build\`。"
            echo "验证方式见包内 VERIFY.md。"
          } >> "$GITHUB_STEP_SUMMARY"

  # 下载页部署到 GitHub Pages：固定 URL 直链四平台包 + 合装包，手机浏览器
  # 免登录一键下（GitHub App 不显示 artifacts；nightly.link 对本仓 404——
  # 自托管直链最稳）。站点 ~255MB < Pages 1GB 限额；每日整站覆盖部署，
  # 历史不累积。固定文件名（unidict-daily.zip 等），每日替换为最新产物。
  deploy-site:
    name: Deploy download page
    needs: [collect]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
      actions: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download platform packages
        uses: actions/download-artifact@v4
        with:
          pattern: pkg-*
          merge-multiple: true
          path: pkgs

      - name: Download daily-build
        uses: actions/download-artifact@v4
        with:
          name: daily-build
          path: daily

      # 跨 run 下载文档站构建产物（deploy-docs.yml 上传的 docs-site artifact）。
      # 容错：文档站尚未构建过时跳过合并，旧下载页仍是首页。
      - name: Resolve docs-site run
        id: docs_run
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 注意相对路径必须带 repos/{owner}/{repo}/ 前缀，否则打到 api.github.com 根上 404
          RID=$(gh api "repos/${{ github.repository }}/actions/workflows/deploy-docs.yml/runs?status=success&per_page=1" \
            --jq '.workflow_runs[0].id' 2>/dev/null || true)
          # 只接受纯数字 run id——gh api 出错时会把错误 JSON 打到 stdout，不能让它进 output
          case "$RID" in
            ''|*[!0-9]*) RID='' ;;
          esac
          if [ -n "$RID" ]; then
            echo "run_id=$RID" >> "$GITHUB_OUTPUT"
          fi

      - name: Download docs site build
        if: steps.docs_run.outputs.run_id != ''
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: docs-site
          path: docs-dist
          run-id: ${{ steps.docs_run.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Assemble site
        run: |
          set -e
          mkdir -p site
          cp .github/pages/index.html site/packages.html
          cp docs/logo.svg site/
          UTC_TIME=$(date -u +'%Y-%m-%d %H:%M UTC')
          BJ_TIME=$(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M 北京时间')
          BUILD_DATE=$(date -u +'%Y%m%d')
          sed -i \
            -e "s|__UTC_TIME__|${UTC_TIME}|g" \
            -e "s|__BJ_TIME__|${BJ_TIME}|g" \
            -e "s|__SHORT_SHA__|${GITHUB_SHA::8}|g" \
            -e "s|__BUILD_DATE__|${BUILD_DATE}|g" \
            site/packages.html
          cp pkgs/unidict-*.zip site/
          cp pkgs/unidict-windows-x64-setup.exe site/
          cp pkgs/unidict-linux-*.deb pkgs/unidict-linux-*.rpm site/
          cp daily/unidict-daily.zip site/unidict-daily.zip
          if [ -d docs-dist ] && [ -n "$(ls -A docs-dist 2>/dev/null)" ]; then
            cp -r docs-dist/. site/
            echo "文档站已合并进 Pages"
          else
            echo "docs-site artifact 不可用，保留旧下载页为首页（download.html 仍可访问）"
          fi
          ls -la site/ | head -30

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # 滚动 nightly Release（用户取件主出口，对齐 falcon nightly 形态）：
  # 固定 tag `nightly`（不打版本 tag），每次构建清旧传新只留最新——
  # Release 页 GitHub App 也可见；assets 匿名可下，同时供一键安装脚本
  # （install.sh/install.ps1）直链下载。
  publish-release:
    name: Publish nightly release
    needs: [collect]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download platform packages
        uses: actions/download-artifact@v4
        with:
          pattern: pkg-*
          merge-multiple: true
          path: pkgs

      - name: Download daily-build
        uses: actions/download-artifact@v4
        with:
          name: daily-build
          path: daily

      - name: Publish nightly release (create or clobber)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          # 从合装包解出说明/验证文件，直接作为 release assets（不下载
          # 154MB 合装也能看 VERIFY 指引）
          unzip -j -o daily/unidict-daily.zip BUILD_INFO.txt VERIFY.md -d .
          ASSETS=(pkgs/unidict-windows-x64.zip pkgs/unidict-windows-x64-setup.exe \
                  pkgs/unidict-macos-arm64.zip \
                  pkgs/unidict-linux-x64.zip \
                  pkgs/unidict-linux-x64.deb pkgs/unidict-linux-x64.rpm \
                  pkgs/unidict-linux-arm64.zip \
                  pkgs/unidict-linux-arm64.deb pkgs/unidict-linux-arm64.rpm \
                  pkgs/unidict-android.zip \
                  daily/unidict-daily.zip BUILD_INFO.txt VERIFY.md)
          TITLE="Unidict 每日构建（nightly，滚动更新）"
          NOTES=$(cat <<NOTE
          ## Unidict 每日构建（滚动更新）

          - 更新时间: $(date -u +'%Y-%m-%d %H:%M UTC') / $(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M 北京时间')
          - Commit: ${GITHUB_SHA}
          - 滚动发布：每次构建清旧传新，assets 恒为最新一版；不对应任何版本号，正式发版见 roadmap。

          ## 产物清单

          | asset | 内容 |
          |---|---|
          | unidict-windows-x64.zip | Windows 10/11 x64：GUI + CLI + CLI(std) + relay |
          | unidict-windows-x64-setup.exe | Windows 安装器（Program Files + 开始菜单/桌面快捷方式 + 卸载入口） |
          | unidict-macos-arm64.zip | macOS Apple Silicon：GUI.app + CLI + relay |
          | unidict-linux-x64.zip | Linux x64：CLI(std，无 Qt 依赖) + relay |
          | unidict-linux-x64.deb / .rpm | Linux x64 系统包（deb 系 / rpm 系，CLI + relay） |
          | unidict-linux-arm64.zip | Linux arm64：CLI(std，无 Qt 依赖) + relay |
          | unidict-linux-arm64.deb / .rpm | Linux arm64 系统包（CLI + relay） |
          | unidict-android.zip | Android（arm64+x86_64）：release apk（R8） |
          | unidict-daily.zip | 全平台合装 + BUILD_INFO + VERIFY.md |
          | VERIFY.md / BUILD_INFO.txt | 验证指引与构建信息（免下载直接看） |

          unidict-relay = 自带同步中转（单二进制，密文过境；设备同步默认
          关闭，自建中转形态才需要，用法见 VERIFY.md）。

          ## 最简验证（详见 VERIFY.md）

          \`\`\`
          # Linux/macOS CLI
          UNIDICT_DICTS=dict.json ./unidict_cli_std hello
          # 预期输出: hello: A greeting or expression of goodwill.
          \`\`\`

          Android：安装 unidict-android.apk，状态行出 \`M2-SMOKE-OK\` 即 OK。
          Windows：解压后双击 unidict_qml.exe（SmartScreen 拦截选"仍要运行"），随包 dict.json 自动加载；或跑 unidict-windows-x64-setup.exe 安装器（开始菜单启动，全程无控制台窗口）。
          macOS：\`xattr -cr unidict_qml.app && open unidict_qml.app\`。
          Linux：unidict-linux-<arch>.deb / .rpm 装系统包（\`sudo apt install ./unidict-linux-x64.deb\` 或 \`sudo dnf install ./unidict-linux-x64.rpm\`），装完 \`unidict_cli_std hello\`。
          NOTE
          )
          if gh release view nightly >/dev/null 2>&1; then
            gh release upload nightly --clobber "${ASSETS[@]}"
            gh release edit nightly --title "$TITLE" --notes "$NOTES"
          else
            gh release create nightly --target "$GITHUB_SHA" --latest \
              --title "$TITLE" --notes "$NOTES" "${ASSETS[@]}"
          fi
          # 清单变化时清掉残留的旧名 asset（维持"只留最新"口径）
          for a in $(gh release view nightly --json assets --jq '.assets[].name'); do
            if ! printf '%s\n' "${ASSETS[@]##*/}" | grep -qx "$a"; then
              gh release delete-asset nightly "$a" --yes && echo "removed stale asset: $a"
            fi
          done
          gh release view nightly --json assets --jq '.assets[] | "\(.name)  \(.size) bytes"'
