# Unidict 同步中转——Cloudflare Worker（官方托管形态，开源可自建）
# 部署：wrangler d1 create unidict-relay → 把返回的 database_id 填进来 →
#       wrangler deploy
# 表结构会在首个请求惰性创建（IF NOT EXISTS）；也可手动执行 schema.sql。

name = "unidict-sync-relay"
main = "src/worker.js"
compatibility_date = "2026-09-01"

[[d1_databases]]
binding = "DB"
database_name = "unidict-relay"
# wrangler d1 create unidict-relay 后替换：
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"
